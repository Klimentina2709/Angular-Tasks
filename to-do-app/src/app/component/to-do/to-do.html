<div class="min-h-screen bg-slate-100 px-4 py-12">
  <div class="mx-auto max-w-xl rounded-2xl bg-white p-8 shadow-lg">

    <h1 class="mb-2 text-center text-3xl font-bold text-slate-800">
      My To-Do List
    </h1>

    <p class="mb-8 text-center text-slate-500">
      Keep track of the things you need to do.
    </p>

    <div class="mb-6 flex gap-3">
      <input
        type="text"
        [(ngModel)]="newTask"
        (keyup.enter)="addTask()"
        placeholder="Enter a task..."
        class="min-w-0 flex-1 rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
      >

      <button
        (click)="addTask()"
        class="rounded-lg bg-blue-600 px-5 py-3 font-medium text-white hover:bg-blue-700"
      >
        Add
      </button>
    </div>

   <div class="space-y-3">
  @for (task of tasks; track $index) {
    <div class="flex items-center justify-between rounded-lg bg-slate-50 px-4 py-3">

      <div class="flex min-w-0 items-center gap-3">
        <input
          type="checkbox"
          [checked]="task.completed"
          (change)="toggleTask($index)"
          class="h-4 w-4 cursor-pointer accent-blue-600"
        >

        <span
          class="break-words text-slate-700"
          [class.line-through]="task.completed"
          [class.text-slate-400]="task.completed"
        >
          {{ task.text }}
        </span>
      </div>

      <button
        (click)="deleteTask($index)"
        class="ml-4 shrink-0 text-sm font-medium text-red-500 hover:text-red-700 cursor-pointer"
      >
        Delete
      </button>

    </div>
  }
</div>

@if (tasks.length === 0) {
  <p class="py-6 text-center text-slate-400">
    No tasks yet. Add your first task!
  </p>
}

  </div>
</div>
